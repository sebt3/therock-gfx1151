name: Build TheRock (math-libs, custom-patched)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  THEROCK_TAG: therock-7.14
  # ROCm/TheRock's own official CI run that built the therock-7.14 tag
  # commit (418cd5f) for linux/gfx1151. Found via
  # build_tools/find_artifacts_for_commit.py --commit 418cd5f... --workflow
  # multi_arch_ci.yml --artifact-group gfx115X-all. Overall run conclusion
  # was "failure" (an unrelated job failed) but the gfx1151 artifacts
  # uploaded fine - verified directly against the public S3 bucket
  # (therock-ci-artifacts, anonymous access) before relying on this.
  THEROCK_BASELINE_RUN_ID: "29052575219"

jobs:
  build:
    runs-on: ubuntu-latest
    # Validated locally on real hardware (bootstrap-before-configure, same
    # recipe as below): rocBLAS+dist alone built in ~25 real minutes with
    # zero LLVM/core-runtime rebuild. But the full math-libs set (rocBLAS,
    # hipBLASLt, rocSPARSE, hipSPARSE, rocSOLVER, hipSOLVER, hipBLAS,
    # rocFFT, hipFFT, rocPRIM, hipCUB, rocThrust) is much bigger than that
    # one library - hipBLASLt alone (tensilelite GEMM kernel codegen) is
    # taking multiple 80-minute runs. Bumped the budget to cut down on
    # resume cycles, each of which pays ~10-15min of fixed overhead
    # (clone/fetch/configure) before any real build time - same GH-hosted
    # hard cap (360m) and resumable-cache pattern as stack-torch-gfx1151.
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v4
      with:
        path: patches-repo

    - name: Free up runner disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Get version
      id: version
      run: echo "tag=$(cat patches-repo/.tags)" >> $GITHUB_OUTPUT

    - name: Install build prerequisites
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          ca-certificates curl git gnupg software-properties-common \
          clang lld cmake ninja-build gfortran patchelf automake libtool libtool-bin \
          bison flex xxd scons meson \
          libvulkan-dev mesa-vulkan-drivers python3-dev python3-pip python3-venv \
          build-essential lsb-release procps \
          libgl1-mesa-dev libglx-dev libopengl-dev libsqlite3-dev libdrm-dev

    - name: Install Clang 21 (TheRock requires >= 21)
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        sudo bash /tmp/llvm.sh 21
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 210
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 210
        sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-21 210
        sudo update-alternatives --set clang /usr/bin/clang-21
        sudo update-alternatives --set clang++ /usr/bin/clang++-21
        sudo update-alternatives --set lld /usr/bin/lld-21

    # Full clone (not sparse): cmake needs to see the whole superproject
    # tree to build the DAG, even though --stage math-libs below skips
    # fetching the heavy submodules (amd-llvm etc) we don't need content
    # for. --depth 1 since we only need the tag commit, not history.
    - name: Clone TheRock at ${{ env.THEROCK_TAG }}
      run: |
        git clone --depth 1 --branch "${THEROCK_TAG}" https://github.com/ROCm/TheRock.git /opt/therock

    # Covers lit, pyzstd, boto3, joblib, msgpack, zstandard, PyYAML,
    # CppHeaderParser and everything else fetch_sources.py/buildctl.py/
    # fetch_artifacts.py need - found each of these missing one at a time
    # in local testing before switching to just installing the real list.
    - name: Install TheRock's own Python build deps
      run: pip3 install --break-system-packages --no-cache-dir -r /opt/therock/requirements.txt

    # Scoped to the math-libs stage's own submodules (rocm-libraries,
    # rocm-systems, libhipcxx) via BUILD_TOPOLOGY.toml - skips amd-llvm
    # (2.5G) and everything else not needed here. Also applies TheRock's
    # own internal per-subproject patches (patches/amd-mainline/...).
    - name: Fetch math-libs stage sources
      working-directory: /opt/therock
      run: python3 build_tools/fetch_sources.py --stage math-libs

    # compiler/hipify isn't in the math-libs stage's own submodule set, but
    # the super-project's CMakeLists.txt unconditionally add_subdirectory()s
    # it - cmake needs its CMakeLists.txt on disk even though bootstrap
    # marks it prebuilt and it never actually gets compiled. It's bundled
    # in the same source_set as amd-llvm (huge) in BUILD_TOPOLOGY.toml, so
    # fetch just this one submodule directly instead of pulling that whole
    # set in via fetch_sources.py.
    - name: Fetch hipify submodule (needed for configure, not built)
      working-directory: /opt/therock
      run: git submodule update --init --depth 1 compiler/hipify

    # Our 3 build-process fixes, retriaged this session against the
    # therock-7.14 tag (see repo history). #2/#3 are no-ops for this scoped
    # config (media-libs/testing both off) but harmless to keep applied.
    - name: Apply local patches
      working-directory: /opt/therock
      run: |
        for p in "${GITHUB_WORKSPACE}"/patches-repo/patches/therock-*.patch; do
          echo "Applying $p"
          git apply --verbose "$p"
        done

    # Raw (unextracted) archives - buildctl.py bootstrap below filters
    # these down to just what math-libs needs as inbound deps.
    - name: Fetch official artifact archives
      working-directory: /opt/therock
      run: |
        mkdir -p /opt/raw-artifacts
        python3 build_tools/fetch_artifacts.py \
          --run-id "${THEROCK_BASELINE_RUN_ID}" \
          --run-github-repo ROCm/TheRock \
          --amdgpu-targets gfx1151 \
          --no-extract \
          --output-dir /opt/raw-artifacts

    # MUST run before the first cmake configure: buildctl.py writes
    # "stage.prebuilt" marker files that cmake only respects when it
    # discovers them during the subproject's *initial* configure. Doing
    # this after a first configure does not retroactively skip the
    # already-materialized build steps (found the hard way locally: had
    # to redo the test with a fresh build dir).
    - name: Bootstrap math-libs stage from official artifacts
      working-directory: /opt/therock
      run: |
        python3 build_tools/buildctl.py bootstrap \
          --build-dir build \
          --artifact-dir /opt/raw-artifacts \
          --stage math-libs \
          --target-families gfx1151

    # THEROCK_ENABLE_MIOPEN=OFF: the math-libs *stage* (BUILD_TOPOLOGY.toml)
    # bundles ml-libs (MIOpen) in with math-libs proper, but MIOpen's kernel
    # compilation is by far the most time-consuming thing TheRock builds
    # from source - the first attempt at this build hit the 90min timeout
    # (99% almost certainly stuck in MIOpen, not the actually-fast rocBLAS/
    # hipBLASLt/etc that finished in ~25min in local testing). vLLM's own
    # need is GEMM (rocBLAS/hipBLASLt), not MIOpen's conv-focused kernels -
    # dropping it narrows this repo's actual scope to what's needed.
    # The rest of these mirror what stack-torch-gfx1151's vendored
    # build-vllm.sh disables for its own (fuller) TheRock configure -
    # `therock-artifacts`/`therock-dist` build *everything enabled*, not
    # just math-libs's own inbound deps, so anything not explicitly turned
    # off here still gets attempted even though bootstrap has nothing
    # prebuilt for it. Found this the hard way: rocjitsu (under the
    # unconditional add_subdirectory(emulation) in the root CMakeLists.txt)
    # ran for 34 minutes before failing on a missing libdrm/drm.h header -
    # not something math-libs needs at all.
    #
    # Positioned *before* the cache-restore step, deliberately: TheRock's
    # per-library toggles (ROCWMMA, ROCALUTION, HIPTENSOR, MIOPEN, HIPDNN...)
    # are declared via therock_add_feature() as CACHE BOOL entries with no
    # FORCE, so command-line -D flags always win *on the invocation that
    # sets them* - but if Cache restores an older build/CMakeCache.txt
    # *after* this step (as it did originally), that stale cache silently
    # overwrites ours, reverting every one of these flags to ON. Confirmed
    # directly in a resumed run's configure log: ROCWMMA, ROCALUTION,
    # HIPTENSOR, HIPDNN, HIPDNN_SAMPLES, CORE_RUNTIME_TESTS all showed
    # "Enabled" despite being passed OFF here, and MIOPEN=OFF was getting
    # force-re-enabled via THEROCK_ENABLE_ML_LIBS's REQUIRES chain (never
    # explicitly disabled below, only the individual MIOPEN feature was) -
    # explaining why every resume cycle kept silently rebuilding the full
    # ml-libs/profiler/debug-tools set for hours instead of the narrow
    # BLAS/RAND/FFT/PRIM/SPARSE/SOLVER scope this repo targets.
    - name: Cache build tree
      uses: actions/cache@v4
      with:
        path: /opt/therock/build
        key: therock-mathlibs-build-${{ hashFiles('patches-repo/patches/*.patch') }}-${{ github.run_id }}
        restore-keys: |
          therock-mathlibs-build-${{ hashFiles('patches-repo/patches/*.patch') }}-

    - name: Configure
      working-directory: /opt/therock
      run: |
        cmake -S . -B build -GNinja \
          -DTHEROCK_AMDGPU_FAMILIES=gfx1151 \
          -DTHEROCK_BUILD_TESTING=OFF \
          -DTHEROCK_ENABLE_MEDIA_LIBS=OFF \
          -DTHEROCK_ENABLE_PROFILER=OFF \
          -DTHEROCK_ENABLE_ML_LIBS=OFF \
          -DTHEROCK_ENABLE_MIOPEN=OFF \
          -DTHEROCK_ENABLE_DEBUG_TOOLS=OFF \
          -DTHEROCK_ENABLE_DC_TOOLS=OFF \
          -DTHEROCK_ENABLE_EMULATION=OFF \
          -DTHEROCK_ENABLE_HIPDNN_INTEGRATION_TESTS=OFF \
          -DTHEROCK_ENABLE_HIPDNN_SAMPLES=OFF \
          -DTHEROCK_ENABLE_CORE_RUNTIME_TESTS=OFF \
          -DTHEROCK_ENABLE_CORE_HIPTESTS=OFF \
          -DTHEROCK_ENABLE_HOST_MATH=OFF \
          -DTHEROCK_ENABLE_ROCALUTION=OFF \
          -DTHEROCK_ENABLE_ROCWMMA=OFF \
          -DTHEROCK_ENABLE_HIPTENSOR=OFF \
          -DTHEROCK_ENABLE_ROCSHMEM=OFF \
          -DTHEROCK_ENABLE_ROCJITSU=OFF \
          -DTHEROCK_ENABLE_ROCGDB=OFF \
          -DTHEROCK_ENABLE_ROCR_DEBUG_AGENT=OFF \
          -DTHEROCK_ENABLE_RDC=OFF \
          -DTHEROCK_ENABLE_AMD_DBGAPI=OFF \
          -DTHEROCK_ENABLE_HOTSWAP=OFF

    - name: Build math-libs (compiler-runtime skipped via bootstrap)
      working-directory: /opt/therock
      run: timeout 330m cmake --build build --target therock-artifacts therock-dist -- -j4 || true

    - name: Check build completed
      id: check
      run: |
        if [ -f /opt/therock/build/artifacts/blas_lib_gfx1151/artifact_manifest.txt ]; then
          echo "done=true" >> $GITHUB_OUTPUT
        else
          echo "done=false" >> $GITHUB_OUTPUT
          echo "::warning::Build did not finish in this run; re-run the workflow to resume from cache."
        fi

    - name: Package
      if: steps.check.outputs.done == 'true'
      run: |
        tar czf therock-gfx1151-mathlibs-${{ steps.version.outputs.tag }}.tar.gz -C /opt/therock/build/artifacts .

    - name: Publish release
      if: steps.check.outputs.done == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        files: therock-gfx1151-mathlibs-${{ steps.version.outputs.tag }}.tar.gz
